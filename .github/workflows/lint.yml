name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npx eslint . --ext .js

  ktlint:
    name: ktlint (Kotlin)
    runs-on: ubuntu-latest
    needs: [eslint]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/latest/download/ktlint
          chmod a+x ktlint
      - name: Run ktlint
        run: |
          FILES=$(git ls-files 'src/**/*.kt' || true)
          if [ -z "$FILES" ]; then
            echo "No Kotlin files to lint"
          else
            ./ktlint $FILES
          fi

  swiftlint:
    name: SwiftLint
    runs-on: macos-latest
    needs: [eslint]
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: |
          FILES=$(git ls-files 'src/ios/**/*.swift' || true)
          if [ -z "$FILES" ]; then
            echo "No Swift files to lint"
          else
            swiftlint lint --strict
          fi

  android-build:
    name: Android Build (demo)
    runs-on: ubuntu-latest
    needs: [eslint, ktlint]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: r0adkll/setup-android@v2
        with:
          api-level: 33
          build-tools: 33.0.2
      - name: Install Cordova
        run: npm install -g cordova@11
      - name: Create demo app and build Android
        run: |
          set -e
          npx cordova create demo com.example.demo Demo
          cd demo
          npx cordova platform add android
          npx cordova plugin add ../
          npx cordova build android --no-telemetry

  ios-build:
    name: iOS Build (demo)
    runs-on: macos-latest
    needs: [eslint, swiftlint]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Cordova
        run: npm install -g cordova@11
      - name: Create demo app and build iOS
        run: |
          set -e
          npx cordova create demo com.example.demo Demo
          cd demo
          npx cordova platform add ios
          npx cordova plugin add ../
          npx cordova build ios --no-telemetry
